---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: breeze
  namespace: default
  labels:
    app.kubernetes.io/name: breeze
    app.kubernetes.io/version: v3.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breeze
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breeze
        app.kubernetes.io/version: v3.0
    spec:
      volumes:
      - name: dev-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      # Comment out the following two volumes if you don't want to mount TLS certificates from Kubernetes secrets
      - name: ssl-cert
        secret:
          secretName: breeze-tls-secret
          items:
          - key: tls.crt
            path: breeze.crt
      - name: ssl-key
        secret:
          secretName: breeze-tls-secret
          items:
          - key: tls.key
            path: breeze.key
      containers:
      - name: breeze
        image: registry.example.com/breeze:redacted  # REDACTED placeholder — replace with your registry hostname and image version before apply; build with Dockerfile
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: dev-tun
          mountPath: /dev/net/tun
        # Comment out the following two mounts if you don't want to mount TLS certificates from Kubernetes secrets
        - name: ssl-cert
          mountPath: /opt/cloudaware/breeze/etc/breeze.crt
          subPath: breeze.crt
          readOnly: true
        - name: ssl-key
          mountPath: /opt/cloudaware/breeze/etc/breeze.key
          subPath: breeze.key
          readOnly: true
        env:
          - name: BREEZE_RUNTIME
            value: kubernetes
          - name: BREEZE_K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: BREEZE_K8S_TUNHUB_CLIENT
            value: enabled
          # Log level: info with BREEZE_VERBOSE, debug with BREEZE_DEBUG, warnings and errors only when both are unset
          - name: BREEZE_VERBOSE
            value: "true"
          #- name: BREEZE_DEBUG
          #  value: "true"
        securityContext:
          privileged: false
          capabilities:
            add: [
              "NET_ADMIN",
              "NET_RAW"
            ]
        readinessProbe:
          exec:
            command:
            - grep
            - tunhub
            - "/proc/net/dev"
          initialDelaySeconds: 900
          periodSeconds: 60
          failureThreshold: 60
